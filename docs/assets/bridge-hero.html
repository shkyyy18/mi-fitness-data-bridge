<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;}
  text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;}
</style>
</head>
<body>
<svg width="2044" height="1150" viewBox="0 0 2044 1150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08824"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d8a4c"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 标题区 -->
  <text x="1022" y="110" text-anchor="middle" font-size="72" font-weight="700" fill="#1a1a1a">米桥</text>
  <text x="1022" y="172" text-anchor="middle" font-size="30" fill="#777777">把封闭的米家数据，连接到 AI 大模型 · 本地优先 · 数据不出本机</text>

  <!-- 分列小标题 -->
  <text x="262" y="262" text-anchor="middle" font-size="32" font-weight="700" fill="#e08824">米家设备</text>
  <text x="1022" y="262" text-anchor="middle" font-size="32" font-weight="700" fill="#3d8a4c">本项目</text>
  <text x="1760" y="262" text-anchor="middle" font-size="32" font-weight="700" fill="#5b83c4">AI 大模型</text>

  <!-- 连接线（先画线，卡片后盖） -->
  <g fill="none" stroke-linecap="round">
    <!-- 左：设备 -> 中心（橙色，平滑贝塞尔） -->
    <path d="M 470 350 C 660 350, 720 500, 864 545" stroke="#e08824" stroke-width="3" opacity="0.85" marker-end="url(#arrowOrange)"/>
    <path d="M 470 505 C 660 505, 720 545, 864 562" stroke="#e08824" stroke-width="3" opacity="0.85" marker-end="url(#arrowOrange)"/>
    <path d="M 470 660 C 660 660, 720 620, 864 590" stroke="#e08824" stroke-width="3" opacity="0.85" marker-end="url(#arrowOrange)"/>
    <path d="M 470 815 C 660 815, 740 655, 864 605" stroke="#e08824" stroke-width="3" opacity="0.85" marker-end="url(#arrowOrange)"/>
    <!-- 右：中心 -> AI（绿色，平滑贝塞尔） -->
    <path d="M 1180 545 C 1380 500, 1470 380, 1554 345" stroke="#3d8a4c" stroke-width="3" opacity="0.85" marker-end="url(#arrowGreen)"/>
    <path d="M 1180 560 C 1380 540, 1470 480, 1554 462" stroke="#3d8a4c" stroke-width="3" opacity="0.85" marker-end="url(#arrowGreen)"/>
    <path d="M 1180 575 C 1380 580, 1470 592, 1554 596" stroke="#3d8a4c" stroke-width="3" opacity="0.85" marker-end="url(#arrowGreen)"/>
    <path d="M 1180 590 C 1380 625, 1470 700, 1554 730" stroke="#3d8a4c" stroke-width="3" opacity="0.85" marker-end="url(#arrowGreen)"/>
    <path d="M 1180 605 C 1380 665, 1470 815, 1554 862" stroke="#3d8a4c" stroke-width="3" opacity="0.85" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- 连接标签 -->
  <text x="671" y="330" text-anchor="middle" font-size="26" fill="#999999">采集 / 同步</text>
  <text x="1367" y="330" text-anchor="middle" font-size="26" fill="#999999">MCP / 导出</text>

  <!-- 左侧设备卡片 -->
  <g filter="url(#soft)">
    <g>
      <rect x="90" y="300" width="380" height="100" rx="18" fill="#ffffff" stroke="#e08824" stroke-width="2.5"/>
      <rect x="90" y="455" width="380" height="100" rx="18" fill="#ffffff" stroke="#e08824" stroke-width="2.5"/>
      <rect x="90" y="610" width="380" height="100" rx="18" fill="#ffffff" stroke="#e08824" stroke-width="2.5"/>
      <rect x="90" y="765" width="380" height="100" rx="18" fill="#ffffff" stroke="#e08824" stroke-width="2.5"/>
    </g>
  </g>
  <!-- 设备小图标（简洁线性风） -->
  <g stroke="#e08824" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 手环 -->
    <rect x="140" y="322" width="34" height="56" rx="10"/>
    <path d="M148 322 v-8 h18 v8 M148 378 v8 h18 v-8"/>
    <!-- 手表 -->
    <circle cx="157" cy="505" r="24"/>
    <path d="M157 492 v13 l9 6 M143 477 v-6 h28 v6 M143 533 v6 h28 v-6"/>
    <!-- 体脂秤 -->
    <rect x="133" y="632" width="48" height="56" rx="8"/>
    <rect x="143" y="642" width="28" height="12" rx="3"/>
    <circle cx="148" cy="672" r="4"/> <circle cx="166" cy="672" r="4"/>
    <!-- 手机 App -->
    <rect x="137" y="772" width="40" height="70" rx="8"/>
    <line x1="150" y1="830" x2="164" y2="830"/>
  </g>
  <text x="215" y="362" font-size="34" font-weight="600" fill="#333333">小米手环</text>
  <text x="215" y="517" font-size="34" font-weight="600" fill="#333333">小米手表</text>
  <text x="215" y="672" font-size="34" font-weight="600" fill="#333333">小米体脂秤</text>
  <text x="215" y="827" font-size="34" font-weight="600" fill="#333333">米家 App</text>

  <!-- 中心卡片 -->
  <g filter="url(#soft)">
    <rect x="872" y="480" width="300" height="190" rx="22" fill="#f3faf4" stroke="#3d8a4c" stroke-width="3"/>
  </g>
  <text x="1022" y="572" text-anchor="middle" font-size="42" font-weight="700" fill="#2e7d42">米桥</text>
  <text x="1022" y="624" text-anchor="middle" font-size="23" fill="#5a7a60">本地 SQLite · JSON · CSV</text>
  <text x="1022" y="656" text-anchor="middle" font-size="23" fill="#5a7a60">MCP 服务</text>

  <!-- 右侧 AI 卡片 -->
  <g filter="url(#soft)">
    <rect x="1562" y="295" width="392" height="96" rx="18" fill="#ffffff" stroke="#8a8f98" stroke-width="2.5"/>
    <rect x="1562" y="424" width="392" height="96" rx="18" fill="#ffffff" stroke="#c4763a" stroke-width="2.5"/>
    <rect x="1562" y="553" width="392" height="96" rx="18" fill="#ffffff" stroke="#4a7ddb" stroke-width="2.5"/>
    <rect x="1562" y="682" width="392" height="96" rx="18" fill="#ffffff" stroke="#5b83c4" stroke-width="2.5"/>
    <rect x="1562" y="811" width="392" height="96" rx="18" fill="#ffffff" stroke="#8a8f98" stroke-width="2.5"/>
  </g>
  <text x="1758" y="355" text-anchor="middle" font-size="34" font-weight="600" fill="#333333">Codex</text>
  <text x="1758" y="484" text-anchor="middle" font-size="34" font-weight="600" fill="#c4763a">Claude Code</text>
  <text x="1758" y="613" text-anchor="middle" font-size="34" font-weight="600" fill="#4a7ddb">Kimi</text>
  <text x="1758" y="742" text-anchor="middle" font-size="34" font-weight="600" fill="#5b83c4">GLM 智谱</text>
  <text x="1758" y="871" text-anchor="middle" font-size="30" fill="#777777">及更多 MCP 客户端</text>

  <!-- 底部信任条 -->
  <line x1="262" y1="1015" x2="1782" y2="1015" stroke="#e5e5e5" stroke-width="2"/>
  <text x="1022" y="1075" text-anchor="middle" font-size="28" fill="#999999">凭证存系统钥匙串 · 导出不含 Token · 全部数据在你自己的磁盘上</text>
</svg>
</body>
</html>
